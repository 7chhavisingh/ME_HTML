<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <!-- fieldset creates a box around the elements -->
<legend>Biodata</legend>

<!-- <form action="#" name="YAYYYYYY" target="" method="POST"> -->
<form action="#">
    <label for="name">Name:</label>
<input type="text" name="name" id="name" placeholder="Enter your name">
<br><br>
<label for="pass">Password:</label>
<input type="password" name="pass" id="pass" placeholder="Enter your password">
<br><br>
<label for="Tel">Telephone:</label>
<input type="Tel" name="Tel" id="Tel" placeholder="Enter your telephone number">
<br><br>
<label for="Email">Email:</label>
<input type="Email" name="Email" id="Email" placeholder="Enter your email">
<br><br>
<label for="Age">Age:</label>
<input type="number" name="Age" id="Age" placeholder="Enter your age">
<br><br>
<label for="DOB">Date of Birth:</label>
<input type="date" name="DOB" id="DOB" placeholder="Enter your date of birth">
<br><br>
<label for="add">Address:</label>
<textarea name="add" id="add" id="add" placeholder="Enter your address"></textarea>
<br><br>
<label for="gender">Gender:</label>
<input type="radio" name="gender" id="gender"><label for="gender">Male</label>
<input type="radio" name="gender" id="gender"><label for="gender">Female</label>
<br><br>
<label for="hobb">Hobbies:</label>
<input type="checkbox" name="hobb1" id="hobb1"><label for="hobb">Swimming</label>
<input type="checkbox" name="hobb2" id="hobb2"><label for="hobb">Skating</label>
<input type="checkbox" name="hobb3" id="hobb3"><label for="hobb">Reading</label>
<input type="checkbox" name="hobb4" id="hobb4"><label for="hobb">Travelling</label>
<input type="checkbox" name="hobb5" id="hobb5"><label for="hobb">Dancing</label>
<input type="checkbox" name="hobb6" id="hobb6"><label for="hobb">Singing</label>
<br><br>
<label for="lang">Select any 1 Programming Language:</label>
<select name="lang" id="lang">
    <option value="">Select</option>
    <option value="C">C</option>
    <option value="C++">C++</option>
    <option value="Java">Java</option>
    <option value="Python">Python</option>
    <option value="JavaScript">JavaScript</option>
    <option value="PHP">PHP</option>
    <option value="HTML">HTML</option>
    <option value="CSS">CSS</option>
</select>
</form>
    </fieldset>

</body>
</html>
